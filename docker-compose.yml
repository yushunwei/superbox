version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: superbox-db
    environment:
      POSTGRES_DB: superbox
      POSTGRES_USER: superbox
      POSTGRES_PASSWORD: superbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: superbox-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./superbox-backend
    container_name: superbox-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/superbox
      SPRING_DATASOURCE_USERNAME: superbox
      SPRING_DATASOURCE_PASSWORD: superbox
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-superbox-jwt-secret-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - storage:/app/storage

  frontend:
    build: ./superbox-frontend
    container_name: superbox-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  storage:
