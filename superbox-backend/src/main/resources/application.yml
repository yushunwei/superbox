spring:
  application:
    name: superbox
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/superbox?stringtype=unspecified
    username: superbox
    password: superbox
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 500MB

server:
  port: 8080

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.superbox.app
  type-handlers-package: com.superbox.config
  configuration:
    map-underscore-to-camel-case: true

superbox:
  security:
    jwt:
      secret: ${JWT_SECRET:superbox-jwt-secret-key-change-in-production}
      expiration-ms: 86400000  # 24 hours
  storage:
    root-path: ./storage
  ai:
    default-provider: openai-compatible
    providers:
      openai-compatible:
        api-key: ${OPENAI_API_KEY:}
        base-url: https://api.openai.com/v1
        chat-model: gpt-4o-mini
        embedding-model: text-embedding-3-small
      anthropic-compatible:
        api-key: ${ANTHROPIC_API_KEY:}
        base-url: https://api.anthropic.com
        chat-model: claude-sonnet-4-6
      ollama:
        base-url: http://localhost:11434
        chat-model: qwen2.5
        embedding-model: nomic-embed-text
  translate:
    segment-max-chars: 2000
    max-concurrent-segments: 8
    context-window-size: 1
    output-retention-days: 7
